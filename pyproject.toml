[project]
name = "connect4"
version = "0.1.0"
description = "A Connect 4 game server"
readme = "README.md"
authors = [
    { name = "Mickael Pham", email = "inbox@mickael.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "PyJWT>=2.10.0",
    "python-ulid>=3.0.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.15.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
